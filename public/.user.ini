; Menaikkan batas upload PHP bawaan hosting — perlu untuk form order (multi-foto)
; dan upload foto set terakit. Berlaku otomatis di hosting PHP-FPM/CGI (termasuk
; kebanyakan cPanel) tanpa perlu akses terminal/SSH. Perubahan bisa butuh
; beberapa menit untuk aktif (di-cache oleh PHP, lihat user_ini.cache_ttl).
upload_max_filesize = 25M
post_max_size = 30M
memory_limit = 256M
max_execution_time = 120
max_input_time = 120
